<!doctype html>
<html lang="es-CO">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala de Sesiones — Acta (borrador)</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="barra-acciones">
    <button class="btn sm" id="volver">Mesa</button>
    <button class="btn sm" id="csv">CSV de resultados</button>
    <button class="btn sm" id="json">Descargar acta</button>
    <button class="btn sm primary" id="imprimir">Imprimir</button>

  <article class="acta" id="acta">

    <p class="centro pequeno" id="encabezado">Cargando…</p>

    <div id="firmas"></div>
  </article>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/js/common.js"></script>
  <script src="/js/acta.js"></script>

</html>
